# Phase 14, candidate A: run e with the larger HRNet.
#
# HRNet-W32 won the comparison of four networks at 1024 by keeping a
# high-resolution branch throughout. W48 widens every branch by half. Everything
# else is run e, line for line, including the batch of two frames.
fold: 0
image_size: 1024

architecture: Unet
encoder: tu-hrnet_w48
encoder_weights: imagenet

epochs: 20
batch_size: 2
learning_rate: 3.0e-4
weight_decay: 1.0e-4

seed: 20260921

num_workers: 0
amp: true

output_dir: outputs/phase14_hrnet_w48

augmentation:
  horizontal_flip: true
  vertical_flip: true
  quarter_turns: true

loss:
  dice_weight: 1.0
  bce_weight: 1.0
