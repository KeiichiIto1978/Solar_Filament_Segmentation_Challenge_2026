# Phase 6, architecture comparison, run 3 of 4.
#
# The decoder, on top of run 2's encoder. UPerNet pools its deepest
# features over the whole frame before decoding, which is the property
# being tested: an S-shaped filament can span a third of the disk, and a
# U-Net decoder only ever sees it through a stack of local windows.
#
# Everything outside the two lines below is held at the values Phase 1 settled
# on, so that the difference between these four runs is the network and
# nothing else. Twenty epochs rather than forty: Phase 1 measured PQ 0.3661 at
# ten epochs, 0.3793 at twenty and 0.3794 at twenty-nine, so the schedule is
# cut where it stopped paying. The cosine schedule is set from the epoch count,
# so each run still completes a full decay rather than being stopped early.
fold: 0
image_size: 1024

architecture: UPerNet
encoder: tu-convnext_tiny
encoder_weights: imagenet

epochs: 20
batch_size: 4
learning_rate: 3.0e-4
weight_decay: 1.0e-4

seed: 20260921

num_workers: 0
amp: true

output_dir: outputs/phase6_c_upernet_convnext

augmentation:
  horizontal_flip: true
  vertical_flip: true
  quarter_turns: true

loss:
  dice_weight: 1.0
  bce_weight: 1.0
