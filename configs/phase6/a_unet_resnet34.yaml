# Phase 6, architecture comparison, run 1 of 4.
#
# The reference. Identical to the Phase 1 baseline except for the epoch
# count, which is what makes it comparable with the other three rather
# than with the forty-epoch number already on record.
#
# Everything outside the two lines below is held at the values Phase 1 settled
# on, so that the difference between these four runs is the network and
# nothing else.
#
# Twenty epochs. The checkpoint behind the incumbent PQ 0.3756 was trained for
# fifteen, and a separate forty-epoch run found its lowest validation loss at
# epoch eight to ten and never beat it afterwards -- training loss kept falling
# from 0.315 to 0.193 while validation drifted from 0.366 to 0.379. Twenty
# gives an unfamiliar network slightly more room than the incumbent had without
# paying for a length already shown to be wasted. The cosine decay is set from
# the epoch count, so each run completes its own rather than being cut short.
fold: 0
image_size: 1024

architecture: Unet
encoder: resnet34
encoder_weights: imagenet

epochs: 20
batch_size: 4
learning_rate: 3.0e-4
weight_decay: 1.0e-4

seed: 20260921

num_workers: 0
amp: true

output_dir: outputs/phase6_a_unet_resnet34

augmentation:
  horizontal_flip: true
  vertical_flip: true
  quarter_turns: true

loss:
  dice_weight: 1.0
  bce_weight: 1.0
